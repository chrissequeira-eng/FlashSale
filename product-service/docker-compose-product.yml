version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: flashsale-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Chris@2026
      MYSQL_DATABASE: flashsale
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-service:
    image: chrisnathansequeira/flashsale-product:latest
    container_name: flashsale-product
    restart: unless-stopped
    network_mode: host
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/flashsale?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data: