version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: flashsale-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Chris@2026
      MYSQL_DATABASE: flashsale
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flashsale-net

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: flashsale-product
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/flashsale?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Chris@2026
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - flashsale-net
    restart: on-failure

volumes:
  mysql-data:

networks:
  flashsale-net:
    driver: bridge